<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">TaskFlow<span class="dot">.</span></div>
    <p class="auth-sub">Manage your tasks, effortlessly.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn-auth" onclick="login()">Login</button>
      <p class="auth-hint">First registered user gets Admin access.</p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Prince Goyal" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters" />
      </div>
      <button class="btn-auth" onclick="register()">Create Account</button>
    </div>

    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <span class="nav-logo">TaskFlow<span class="dot">.</span></span>
      <span id="roleTag" class="role-tag"></span>
    </div>
    <div class="nav-right">
      <span id="navUser" class="nav-user"></span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <span class="stat-num" id="statTotal">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="statTodo">0</span>
      <span class="stat-label">To Do</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="statProgress">0</span>
      <span class="stat-label">In Progress</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="statDone">0</span>
      <span class="stat-label">Completed</span>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main">

    <!-- Filters + Add Button -->
    <div class="toolbar">
      <div class="filters">
        <select id="filterStatus" onchange="loadTasks()">
          <option value="">All Status</option>
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <select id="filterPriority" onchange="loadTasks()">
          <option value="">All Priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search tasks..." oninput="loadTasks()" />
      </div>
      <button class="btn-add" onclick="openModal()">+ Add Task</button>
    </div>

    <!-- Task Board -->
    <div class="board">
      <div class="column" id="col-todo">
        <div class="col-header">
          <span class="col-dot dot-todo"></span>
          <h3>To Do</h3>
          <span class="col-count" id="count-todo">0</span>
        </div>
        <div class="task-list" id="list-todo"></div>
      </div>
      <div class="column" id="col-progress">
        <div class="col-header">
          <span class="col-dot dot-progress"></span>
          <h3>In Progress</h3>
          <span class="col-count" id="count-progress">0</span>
        </div>
        <div class="task-list" id="list-progress"></div>
      </div>
      <div class="column" id="col-done">
        <div class="col-header">
          <span class="col-dot dot-done"></span>
          <h3>Completed</h3>
          <span class="col-count" id="count-done">0</span>
        </div>
        <div class="task-list" id="list-done"></div>
      </div>
    </div>

    <div id="emptyState" class="empty-state" style="display:none">
      <p>🎯 No tasks yet. Add your first task!</p>
    </div>

  </main>
</div>

<!-- TASK MODAL -->
<div id="taskModal" class="modal-overlay" style="display:none" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Task</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="taskTitle" placeholder="Task title..." />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="taskDesc" placeholder="Optional description..." rows="3"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select id="taskStatus">
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Due Date</label>
      <input type="date" id="taskDue" />
    </div>
    <div id="modalMsg" class="auth-msg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="saveBtn" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
